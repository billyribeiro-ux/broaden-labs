name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first run's answer worthless.
# Superseded runs are cancelled; main is not, so every commit on the default
# branch keeps a complete, attributable result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # Every job needs these. PUBLIC_SITE_ENV is development on purpose: the demo
  # content gate refuses a production build while the fictional case studies are
  # still enabled, and the whole test suite asserts against that content.
  PUBLIC_SITE_ENV: development
  PUBLIC_ORIGIN: http://localhost:4173
  PUBLIC_CONTACT_EMAIL: hello@broadenlabs.com
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/broaden_labs?sslmode=disable

jobs:
  verify:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Pinned to the same major as local development. The integration tests
        # run against a real Postgres because the queries they cover are
        # conditional UPDATEs whose whole purpose is to lose races correctly —
        # a mock would assert the mock.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: broaden_labs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # No version here on purpose — the action reads `packageManager` from
        # package.json, so the pnpm version is pinned in exactly one place.

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm db:migrate

      - name: svelte-check
        run: pnpm check

      - name: Prettier and ESLint
        run: pnpm lint

      - name: Unit and integration tests
        run: pnpm test:unit --run

      - name: Build
        run: pnpm build

      # Re-run after the build so the bundle-boundary spec has an artifact to
      # read. It skips itself when there is no build, which is correct on a
      # clean checkout and useless as a guarantee — this is where it counts.
      - name: Bundle boundary (post-build)
        run: pnpm exec vitest run src/lib/components/three/bundle.spec.ts --project=server

  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: broaden_labs
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate

      - name: Install browsers
        # --with-deps pulls the system libraries WebKit and Firefox need on a
        # bare runner; without it they install and then fail to launch.
        run: pnpm exec playwright install --with-deps

      - name: Playwright
        # Every project EXCEPT `visual`. Snapshots are keyed by platform
        # (snapshotPathTemplate includes {platform}) and only darwin baselines
        # are committed, so running it here would compare Linux renderings
        # against nothing. The `visual` job below is where that is handled.
        run: >-
          pnpm exec playwright test
          --project=chromium --project=firefox --project=webkit
          --project=mobile --project=no-js --project=reduced-motion --project=forms

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: Visual regression (linux baselines)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Not required to pass until Linux baselines exist in the repository.
    #
    # Font rasterisation and GPU compositing differ enough between macOS and
    # Linux that darwin baselines cannot be compared against a Linux render —
    # the diff would be thousands of antialiasing pixels and would say nothing
    # about whether the design changed. Baselines have to be generated on the
    # platform that will assert against them, and Docker was not available on
    # the machine this was built on, so they do not exist yet.
    #
    # This job generates them and uploads them as an artifact. Commit
    # `src/__visual/linux/` from that artifact once, then delete this
    # `continue-on-error` line and the job becomes a real gate.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium

      - name: Visual project
        run: pnpm exec playwright test --project=visual

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: visual-baselines-linux
          path: src/__visual/
          retention-days: 30

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Lighthouse runs in Playwright's pinned Chromium rather than whatever
      # Chrome the runner image ships, so the score means the same thing here
      # as it does locally. See resolveChrome() in lighthouserc.cjs.
      - run: pnpm exec playwright install --with-deps chromium

      - name: Lighthouse CI
        run: pnpm lighthouse

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lighthouse-reports
          path: .lighthouseci/reports/
          retention-days: 30

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Its own job, so a new advisory in a transitive dependency reports as
      # "audit failed" rather than making the type checker look broken.
      - name: pnpm audit
        run: pnpm audit --audit-level=high
