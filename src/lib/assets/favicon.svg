<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Broaden Labs">
	<title>Broaden Labs</title>
	<!--
		The aperture motif at favicon scale: three hairlines of increasing length,
		reading as constraint opening into possibility. Deliberately not a letter
		and not an abstract glyph — at 16px a "B" in a display grotesk turns to
		mush, whereas horizontal rules stay crisp because they land on whole pixels.

		Rules are 2px on a 32px canvas so they survive the 16x16 downscale.
	-->
	<rect id="field" width="32" height="32" fill="#090A0C" />
	<g id="rules" fill="#289DD7">
		<rect x="7" y="9" width="8" height="2" />
		<rect x="7" y="15" width="14" height="2" />
		<rect x="7" y="21" width="18" height="2" />
	</g>
	<style>
		/* Inverts against light browser chrome. The accent is unchanged — only the
		   field it sits on, so the identity stays constant. */
		@media (prefers-color-scheme: light) {
			#field { fill: #F3F1EA; }
			#rules { fill: #00669C; }
		}
	</style>
</svg>
